<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maksim | Linktree</title>
  <meta name="description" content="Maksim's links: portfolio, Discord, Roblox, Telegram." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #09111f;
      --bg-2: #152b48;
      --accent-1: #30d4ff;
      --accent-2: #7dffce;
      --text: #f4f8ff;
      --muted: #b9c7dc;
      --card: rgba(11, 20, 34, 0.72);
      --border: rgba(160, 198, 255, 0.28);
      --shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(45rem 45rem at 10% -5%, rgba(48, 212, 255, 0.18), transparent 55%),
        radial-gradient(32rem 32rem at 95% 0%, rgba(125, 255, 206, 0.16), transparent 60%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 999px;
      filter: blur(60px);
      z-index: -1;
      opacity: 0.5;
      animation: float 10s ease-in-out infinite;
    }

    body::before {
      width: 220px;
      height: 220px;
      background: rgba(48, 212, 255, 0.45);
      top: 10%;
      left: -40px;
    }

    body::after {
      width: 180px;
      height: 180px;
      background: rgba(125, 255, 206, 0.4);
      bottom: 8%;
      right: -30px;
      animation-delay: -3s;
    }

    .card {
      width: min(100%, 460px);
      padding: 36px 26px 26px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      animation: rise 0.7s ease-out both;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: block;
      object-fit: cover;
      border: 2px solid rgba(125, 255, 206, 0.6);
      box-shadow: 0 14px 30px rgba(48, 212, 255, 0.28);
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }

    h1 {
      margin: 0;
      text-align: center;
      font-family: "Sora", sans-serif;
      font-size: clamp(1.7rem, 4vw, 2rem);
      letter-spacing: 0.4px;
    }

    .subtitle {
      margin: 8px 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.2px;
      padding: 14px 16px;
      border: 1px solid rgba(184, 219, 255, 0.26);
      border-radius: 15px;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      opacity: 0;
      transform: translateY(8px);
      animation: reveal 0.45s ease forwards;
    }

    .link:nth-child(1) { animation-delay: 0.16s; }
    .link:nth-child(2) { animation-delay: 0.26s; }
    .link:nth-child(3) { animation-delay: 0.36s; }
    .link:nth-child(4) { animation-delay: 0.46s; }

    .link .name {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .link .arrow {
      font-size: 1rem;
      color: rgba(233, 244, 255, 0.86);
      transition: transform 0.2s ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(125, 255, 206, 0.62);
      box-shadow: 0 10px 28px rgba(2, 10, 21, 0.45);
      background: linear-gradient(140deg, rgba(48, 212, 255, 0.16), rgba(125, 255, 206, 0.1));
      outline: none;
    }

    .link:hover .arrow,
    .link:focus-visible .arrow {
      transform: translateX(3px);
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: rgba(200, 217, 241, 0.85);
      font-size: 0.82rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    @media (max-width: 520px) {
      .card {
        padding: 30px 18px 20px;
        border-radius: 22px;
      }

      .link {
        padding: 13px 14px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Linktree profile">
    <img class="avatar" src="https://www.roblox.com/headshot-thumbnail/image?userId=1424249471&width=420&height=420&format=png" alt="Maksim Roblox avatar" loading="eager" decoding="async" />
    <h1>Maksim</h1>
    <p class="subtitle">Game Developer and Creator</p>

    <section class="links" aria-label="Social links">
      <a class="link" href="https://maksimgeims.github.io/Roblox-Portfolio/" target="_blank" rel="noopener noreferrer">
        <span class="name">Portfolio</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://discord.com/users/qunilt" target="_blank" rel="noopener noreferrer">
        <span class="name">Discord: @qunilt</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://www.roblox.com/users/1424249471/profile" target="_blank" rel="noopener noreferrer">
        <span class="name">Roblox Profile</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="https://t.me/StudioDevX" target="_blank" rel="noopener noreferrer">
        <span class="name">Telegram</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <p class="footer">Built with focus and style.</p>
  </main>
</body>
</html>
